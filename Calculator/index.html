<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        #calculator {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 equal columns */
            grid-template-rows: repeat(4,1fr);
            gap: 10px;
            width: 250px;
            margin: auto;
            border: 2px solid #3f3f3f;
            padding: 20px;
            border-radius: 5%;
            }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Calculator</h1>
    <div id="calculator">
        <button id="1">1</button><button id="2">2</button><button id="3">3</button><button id="+">+</button>
        <button id="4">4</button><button id="5">5</button><button id="6">6</button><button id="-">-</button>
        <button id="7">7</button><button id="8">8</button><button id="9">9</button><button id="X">x</button>
        <button id="0">0</button><button id="clear">C</button><button id="submit">✔️</button><button id="/">÷</button>
        <p id="output"  style="text-align: center; font-weight: bold; border: 2px solid gray; grid-column:span 4"><br/></p>
    </div> 
</body>
<script src="./functionality.js"></script>
</html>
